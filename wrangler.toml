name = "iipython-status-page"
main = "fetch_status.js"
compatibility_date = "2024-09-28"

workers_dev = false
send_metrics = false

# Force enable keeping logs
[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[dev]
port=1241

# Setup KV
[[kv_namespaces]]
binding = "statuspage_data"
id = "cdec5b397e54472388031b13783de58e"
